name: Deploy static rules demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live application over HTTPS
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          url = os.environ["SITE_URL"]
          for attempt in range(20):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      html = response.read().decode("utf-8")
                      if response.status == 200 and 'mode:"BROWSER_RULE_DEMO"' in html and '<form id="audit-form">' in html:
                          print(f"Verified live application HTTP 200 and evaluation UI: {url}")
                          break
              except (OSError, UnicodeError) as exc:
                  print(f"Attempt {attempt + 1}: {exc}")
              time.sleep(3)
          else:
              raise SystemExit("Deployed site failed HTTP/content smoke test")
          PY

