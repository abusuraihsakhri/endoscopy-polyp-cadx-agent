[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "endoscopy-polyp-cadx-engine"
version = "2.0.0"
description = "EndoCADx: Colonoscopy Polyp NICE & WASP Optical Diagnosis Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
endoscopy-polyp-cadx-engine = "endo_cadx_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/endoscopy-polyp-cadx-engine"
Repository = "https://github.com/abusuraihsakhri/endoscopy-polyp-cadx-engine.git"
