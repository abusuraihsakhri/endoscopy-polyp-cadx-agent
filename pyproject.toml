[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "endoscopy-polyp-cadx-engine"
version = "2.1.0"
description = "EndoCADx: Colonoscopy Polyp NICE & WASP Optical Diagnosis Engine with Zero-PHI Guard"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
endoscopy-polyp-cadx-engine = "endo_cadx_agent.cli:main"
endoscopy-polyp-cadx-agent = "cli:main"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents", "agents.*", "endo_cadx_agent", "endo_cadx_agent.*"]

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/endoscopy-polyp-cadx-agent"
Repository = "https://github.com/abusuraihsakhri/endoscopy-polyp-cadx-agent.git"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
